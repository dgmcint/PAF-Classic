[package]
name = "paf-classic"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/dgmcint/PAF-Classic"
description = "PAF Classic: an offline genealogy program in the spirit of PAF 5"

# Used by `cargo bundle --release` to make "PAF Classic.app" (and a .deb on Linux).
[package.metadata.bundle]
name = "PAF Classic"
identifier = "io.github.dgmcint.pafclassic"
icon = ["assets/icon.icns", "assets/icon.png"]
version = "0.1.0"
copyright = "PAF Classic contributors. Free for noncommercial use. PAF was created by The Church of Jesus Christ of Latter-day Saints."
category = "public.app-category.productivity"
short_description = "An offline genealogy program in the spirit of PAF 5"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = "0.25.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Used by `cargo run --release` and `cargo build --release`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
