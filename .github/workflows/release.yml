# Builds PAF Classic for macOS (Intel and Apple Silicon), Windows and Linux.
# Runs on every push and pull request as a check. Pushing a tag such as v0.1.0
# also publishes a GitHub Release with all four downloads attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: paf-classic

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            package: PAF-Classic-macos-apple-silicon
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            package: PAF-Classic-macos-intel
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: PAF-Classic-windows-x64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            package: PAF-Classic-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dist/PAF Classic.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cp target/${{ matrix.target }}/release/$BIN "$APP/Contents/MacOS/"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ${{ matrix.package }}.zip
          zip -j ${{ matrix.package }}.zip README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/PAF Classic.exe"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/${{ matrix.package }}
          cp target/${{ matrix.target }}/release/$BIN README.md LICENSE dist/${{ matrix.package }}/
          tar -czf ${{ matrix.package }}.tar.gz -C dist ${{ matrix.package }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          generate_release_notes: true
